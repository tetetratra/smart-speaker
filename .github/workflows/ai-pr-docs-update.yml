name: AI PR Docs Update

on:
  pull_request:
    types:
      - closed

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: ai-pr-docs-update-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      instruction_body: ${{ steps.context.outputs.instruction_body }}
      merge_commit_sha: ${{ steps.context.outputs.merge_commit_sha }}
      pr_number: ${{ steps.context.outputs.pr_number }}
      pr_url: ${{ steps.context.outputs.pr_url }}
      should_run: ${{ steps.context.outputs.should_run }}
      trigger_actor: ${{ steps.context.outputs.trigger_actor }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: docs 更新コンテキストを解決する
        id: context
        shell: bash
        run: |
          bash .github/scripts/ai_pr/docs_update/resolve_merge_context.sh

      - name: 対象外 PR をスキップする
        if: steps.context.outputs.should_run != 'true'
        shell: bash
        run: |
          case "${{ steps.context.outputs.skip_reason }}" in
            docs_update_pr)
              echo "AIドキュメント更新ラベル付き PR のためスキップします"
              ;;
            not_merged)
              echo "マージされていない PR close のためスキップします"
              ;;
            not_main_base)
              echo "main 以外へのマージのためスキップします"
              ;;
            *)
              echo "条件を満たさないためスキップします"
              ;;
          esac

  run:
    needs: prepare
    if: needs.prepare.outputs.should_run == 'true'
    uses: ./.github/workflows/ai-pr-common.yml
    secrets: inherit
    with:
      context_sha: ${{ needs.prepare.outputs.merge_commit_sha }}
      instruction_body: ${{ needs.prepare.outputs.instruction_body }}
      pr_number: ${{ needs.prepare.outputs.pr_number }}
      pr_url: ${{ needs.prepare.outputs.pr_url }}
      run_mode: docs_update
      target_ref: main
      trigger_actor: ${{ needs.prepare.outputs.trigger_actor }}
