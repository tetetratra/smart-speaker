name: AI PR Bootstrap

on:
  workflow_dispatch:
    inputs:
      pr_title:
        description: PRタイトル
        required: true
        type: string
      request_text:
        description: AIへの依頼文
        required: true
        type: string
      autonomy_level:
        description: 自律レベル
        required: true
        default: level1
        type: string
      codex_model:
        description: Codexモデル名
        required: false
        type: string

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    env:
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      GH_TOKEN: ${{ github.token }}
      INPUT_PR_TITLE: ${{ inputs.pr_title }}
      INPUT_REQUEST_TEXT: ${{ inputs.request_text }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Draft PR を作成する
        id: create
        shell: bash
        run: |
          chmod +x .github/scripts/create_draft_pr.sh
          .github/scripts/create_draft_pr.sh

      - name: 初回 AI 実行を dispatch する
        shell: bash
        run: |
          gh workflow run ai-pr-run.yml \
            --ref "${DEFAULT_BRANCH}" \
            -f pr_number="${{ steps.create.outputs.pr_number }}" \
            -f bootstrap_instruction="${{ inputs.request_text }}" \
            -f bootstrap_actor="${{ github.actor }}" \
            -f autonomy_level="${{ inputs.autonomy_level }}" \
            -f codex_model="${{ inputs.codex_model }}"
