name: AI PR Comment

on:
  issue_comment:
    types:
      - created

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: ai-pr-comment-${{ github.event.issue.number || github.run_id }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      allowed: ${{ steps.permission.outputs.allowed }}
      branch_name: ${{ steps.context.outputs.branch_name }}
      head_sha: ${{ steps.context.outputs.head_sha }}
      instruction_body: ${{ steps.context.outputs.instruction_body }}
      pr_number: ${{ steps.context.outputs.pr_number }}
      pr_url: ${{ steps.context.outputs.pr_url }}
      should_run: ${{ steps.context.outputs.should_run }}
      trigger_actor: ${{ steps.context.outputs.trigger_actor }}
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4

      - name: PR コメントの実行コンテキストを解決する
        id: context
        shell: bash
        run: |
          bash .github/scripts/ai_pr/comment/resolve_comment_context.sh

      - name: 対象外コメントをスキップする
        if: steps.context.outputs.should_run != 'true'
        shell: bash
        run: |
          case "${{ steps.context.outputs.skip_reason }}" in
            not_pr_comment)
              echo "PR へのコメントではないためスキップします"
              ;;
            closed_pr)
              echo "close 済み PR へのコメントのためスキップします"
              ;;
            missing_request)
              echo "PR に依頼内容が見つからないためスキップします"
              ;;
            missing_ai_label)
              echo "AI主導開発ラベル付き PR ではないためスキップします"
              ;;
            bot_comment)
              echo "bot コメントのためスキップします"
              ;;
            *)
              echo "条件を満たさないためスキップします"
              ;;
          esac

      - name: 実行権限を確認する
        id: permission
        if: steps.context.outputs.should_run == 'true'
        shell: bash
        run: |
          allowed="true"
          if permission="$(gh api "/repos/${REPO}/collaborators/${{ steps.context.outputs.trigger_actor }}/permission" --jq '.permission' 2>/dev/null)"; then
            case "$permission" in
              admin|maintain|write) ;;
              *)
                allowed="false"
                gh pr comment "${{ steps.context.outputs.pr_number }}" --body "この AI 実行は書き込み権限を持つユーザーのみ利用できます。"
                ;;
            esac
          else
            allowed="false"
            gh pr comment "${{ steps.context.outputs.pr_number }}" --body "この AI 実行は書き込み権限を持つユーザーのみ利用できます。"
          fi
          echo "allowed=$allowed" >> "$GITHUB_OUTPUT"

      - name: "コメントへ :+1: を付ける"
        if: steps.context.outputs.should_run == 'true' && steps.permission.outputs.allowed == 'true'
        shell: bash
        env:
          COMMENT_ID: ${{ steps.context.outputs.comment_id }}
        run: |
          if ! gh api \
            -X POST \
            "/repos/${REPO}/issues/comments/${COMMENT_ID}/reactions" \
            -H "Accept: application/vnd.github+json" \
            -f content='+1' >/dev/null; then
            echo "warning: failed to add reaction" >&2
          fi

  run:
    needs: prepare
    if: needs.prepare.outputs.should_run == 'true' && needs.prepare.outputs.allowed == 'true'
    uses: ./.github/workflows/ai-pr-common.yml
    secrets: inherit
    with:
      instruction_body: ${{ needs.prepare.outputs.instruction_body }}
      pr_number: ${{ needs.prepare.outputs.pr_number }}
      pr_url: ${{ needs.prepare.outputs.pr_url }}
      target_ref: ${{ needs.prepare.outputs.branch_name }}
      context_sha: ${{ needs.prepare.outputs.head_sha }}
      trigger_actor: ${{ needs.prepare.outputs.trigger_actor }}
