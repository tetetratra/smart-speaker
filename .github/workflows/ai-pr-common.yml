name: AI PR Common

on:
  workflow_call:
    inputs:
      context_sha:
        required: false
        type: string
      instruction_body:
        required: true
        type: string
      pr_number:
        required: true
        type: string
      pr_url:
        required: false
        type: string
      run_mode:
        default: normal
        required: false
        type: string
      target_ref:
        required: true
        type: string
      trigger_actor:
        required: false
        type: string
    secrets:
      CODEX_AUTH_JSON_B64:
        required: false

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      CODEX_HOME: ${{ github.workspace }}/.tmp/codex-home
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      STATE_ROOT: ${{ github.workspace }}/.tmp/codex-state
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.target_ref }}

      - name: Codex 認証を復元する
        id: auth
        shell: bash
        env:
          CODEX_AUTH_JSON_B64: ${{ secrets.CODEX_AUTH_JSON_B64 }}
        run: |
          if [ -z "${CODEX_AUTH_JSON_B64:-}" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p "$CODEX_HOME"
          chmod 700 "$CODEX_HOME"
          printf '%s' "$CODEX_AUTH_JSON_B64" | base64 --decode > "$CODEX_HOME/auth.json"
          chmod 600 "$CODEX_HOME/auth.json"
          echo "available=true" >> "$GITHUB_OUTPUT"

      - name: 認証未設定を通知する
        if: steps.auth.outputs.available != 'true'
        shell: bash
        run: |
          gh pr comment "${{ inputs.pr_number }}" --body "Codex 認証情報が未設定です。trusted machine で Codex にログインし、\`CODEX_AUTH_JSON_B64\` を設定してください。"

      - name: Git ユーザーを設定する
        if: steps.auth.outputs.available == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: 状態 Artifact を復元する
        id: state
        if: steps.auth.outputs.available == 'true'
        shell: bash
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          bash .github/scripts/ai_pr/common/restore_state_artifact.sh

      - name: Docker Buildx を設定する
        if: steps.auth.outputs.available == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Codex runner イメージを build する
        if: steps.auth.outputs.available == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .github/docker
          file: .github/docker/codex-runner.Dockerfile
          load: true
          tags: codex-runner:${{ github.run_id }}
          cache-from: type=gha,scope=codex-runner
          cache-to: type=gha,mode=max,scope=codex-runner

      - name: Codex を実行する
        id: codex
        if: steps.auth.outputs.available == 'true'
        continue-on-error: true
        shell: bash
        env:
          CONTEXT_SHA: ${{ inputs.context_sha }}
          INSTRUCTION_BODY: ${{ inputs.instruction_body }}
        run: |
          mkdir -p "${STATE_ROOT}/run"
          printf '%s' "$INSTRUCTION_BODY" > "${STATE_ROOT}/run/instruction.txt"
          docker run --rm \
            -e CODEX_HOME=/codex-home \
            -e GH_TOKEN="${GH_TOKEN}" \
            -e GITHUB_TOKEN="${GH_TOKEN}" \
            -e HEAD_SHA="${CONTEXT_SHA}" \
            -e INSTRUCTION_FILE=/state/run/instruction.txt \
            -e PR_BRANCH="${{ inputs.target_ref }}" \
            -e PR_NUMBER="${{ inputs.pr_number }}" \
            -e PR_URL="${{ inputs.pr_url }}" \
            -e REPO="${REPO}" \
            -e RUN_MODE="${{ inputs.run_mode }}" \
            -e STATE_ROOT=/state \
            -e TRIGGER_ACTOR="${{ inputs.trigger_actor }}" \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            -v "${CODEX_HOME}:/codex-home" \
            -v "${STATE_ROOT}:/state" \
            "codex-runner:${GITHUB_RUN_ID}" \
            bash -lc '
              bash /workspace/.github/scripts/ai_pr/common/run_codex.sh
            '

      - name: 状態 Artifact を保存する
        if: always() && steps.auth.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.state.outputs.artifact_name }}
          path: ${{ env.STATE_ROOT }}
          retention-days: 30
          overwrite: true

      - name: 失敗時のフォールバックコメントを投稿する
        if: steps.auth.outputs.available == 'true' && steps.codex.outcome == 'failure'
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/ai-run-failure-comment.md" <<'EOF'
          AI 実行に失敗しました。

          - 認証切れの可能性がある場合は、trusted machine で `codex login` をやり直して `CODEX_AUTH_JSON_B64` を再設定してください。
          - それ以外の場合は、この workflow run のログを確認してください。
          EOF
          gh pr comment "${{ inputs.pr_number }}" --body-file "$RUNNER_TEMP/ai-run-failure-comment.md"
