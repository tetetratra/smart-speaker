# smart-speaker の設定ファイルのサンプルです。
#
# 使い方:
#   cp config.sample.yaml config.yaml
#   変更したい項目のコメントを外して値を書き込みます。
#
# - config.yaml は .gitignore 済みです。リポジトリへコミットしないでください。
# - config.yaml が無い場合や、項目が書かれていない場合は、各項目に記載した既定値を使います。
# - 未知のキー（書き間違い）や型の誤りがあると起動時にエラーになります。
# - APIキーなどのシークレットはこのファイルに書かず、環境変数で渡します（README の「設定」を参照）。

# システムプロンプトの末尾に追記する内容。環境ごとの事情（家族構成、家電の呼び名など）を書きます。既定: なし
# 既定のシステムプロンプトは internal/app/system_prompt.go にあります。
# additional_system_prompt: |
#   ユーザーの名前は太郎です。
#   リビングのエアコンは「エアコン」と呼びます。

server:
  # HTTP / WebSocket サーバーの待ち受けアドレス。既定: ":8081"
  # ws_addr: ":8081"

  # ビルド済みフロントエンドの配信ディレクトリ。既定: "web/dist"
  # web_dist_dir: "web/dist"

rtc:
  # ブラウザから到達できるサーバーのIPv4アドレス。既定: なし（Pionが検出したアドレスだけを使う）
  # RFC 1918 のプライベートIPv4と、Tailscale の 100.64.0.0/10 だけを指定できます。
  # 環境変数 RTC_ICE_ADVERTISE_IPS（カンマ区切り）があれば、そちらを優先します。
  # 本番ではデプロイスクリプトがこの環境変数を設定します。
  # ice_advertise_ips:
  #   - 192.168.0.10

openai:
  # 長い履歴の要約・Web検索に使う Responses API のモデル（メモリの抽出は memory.model）。
  # 既定: "gpt-5.4-nano-2026-03-17"
  # responses_model: "gpt-5.4-nano-2026-03-17"

  realtime:
    # 会話モデル。既定: "gpt-realtime-2.1"
    # model: "gpt-realtime-2.1"

    # 発話の区切り。"semantic_vad" または "server_vad"。未対応の値は起動時にエラーになります。既定: "semantic_vad"
    # vad: "semantic_vad"

    # 入力音声のノイズ除去。"far_field"（スマートスピーカーのように離れて話す）または "near_field"（ヘッドセットのように口元のマイク）。未対応の値は起動時にエラーになります。既定: "far_field"
    # noise_reduction: "far_field"

    # 履歴保存用の非同期文字起こしモデル。音声理解とは別に課金されます。既定: "gpt-4o-mini-transcribe"
    # transcription_model: "gpt-4o-mini-transcribe"

    # テスト用の WebSocket 接続先。通常は指定しません。既定: なし（OpenAI の公式エンドポイント）
    # endpoint: ""

conversation:
  # 古い会話履歴を長期メモリ化する無操作時間（秒）。この時間黙ったときに、memory.memorize_after_hours・memory.history_max_bytes の条件に当たる会話をメモリ化します。0 で無効。既定: 1800
  # idle_timeout_seconds: 1800

memory:
  # メモリの追加・更新・削除の判断に使う Responses API のモデル。既定: "gpt-5.6-luna"
  # model: "gpt-5.6-luna"

  # メモリの保存先。既定: "data/memories.json"
  # wake.store_path、automations.store_path、plugins.googlecalendar.token_path の既定値は、このファイルと同じディレクトリになります。
  # store_path: "data/memories.json"

  # 会話を長期メモリ化するまでの経過時間（時間）。30分以上空いた位置で区切った会話の塊ごとに、最後の記録からこの時間がたったら、conversation.idle_timeout_seconds 黙ったときにメモリ化します。既定: 24
  # memorize_after_hours: 24

  # 会話履歴がこの大きさ（バイト）を超えたら、経過時間によらず古い塊からメモリ化します。接続時には履歴を切り詰めずに全部渡します。既定: 40000
  # history_max_bytes: 40000

automations:
  # 予約ジョブの保存先。既定: memory.store_path と同じディレクトリの "automations.json"
  # store_path: "data/automations.json"

tts:
  # 音声合成のプロバイダ。"voicevox" または "elevenlabs"。既定: "voicevox"
  # 画面から切り替えた場合も、サーバー再起動時はこの値に戻ります。
  # provider: "voicevox"

  voicevox:
    # VOICEVOX Engine の HTTP エンドポイント。既定: "http://voicevox:50021"（Docker Compose 内の VOICEVOX）
    # endpoint: "http://voicevox:50021"

    # スタイルID。VOICEVOX Engine の GET /speakers が返す各スタイルの id を指定します。既定: 1
    # speaker_id: 1

    # 話者名。設定画面に「VOICEVOX:話者名」のクレジットとして表示します。
    # VOICEVOX と各キャラクターの利用規約がクレジット表記を求めるため、speaker_id の話者と一致させてください。
    # 既定: speaker_id も省略したときは "ずんだもん"（スタイルID 1 の話者）、speaker_id だけ指定したときはなし（「VOICEVOX」とだけ表示）
    # speaker_name: "ずんだもん"

    # 話速。指定した場合だけ /audio_query の speedScale を上書きします。0 以下は無視します。既定: なし
    # speed_scale: 1.1

  elevenlabs:
    # ElevenLabs の voice ID。APIキー（ELEVENLABS_API_KEY）と両方そろうと ElevenLabs を選べます。既定: なし
    # voice_id: ""

    # ElevenLabs のモデル。既定: "eleven_v3"
    # model: "eleven_v3"

wake:
  # 呼びかけ必須モードのオン・オフの保存先。既定: memory.store_path と同じディレクトリの "wake-mode.json"
  # store_path: "data/wake-mode.json"

  # 呼びかけ判定に使うローカルSTTのエンドポイント。既定: "http://local-stt:8000/transcribe"（Docker Compose 内の local-stt）
  # local_stt_endpoint: "http://local-stt:8000/transcribe"

  # 呼びかけの言葉。既定: [おきて, 起きて, オッケー]
  # words:
  #   - おきて
  #   - 起きて
  #   - オッケー

  # 呼びかけの前に許す文字数（0〜20）。既定: 4
  # max_prefix: 4

  # STT信頼度の下限（0より大きく1以下）。既定: 0.55
  # min_confidence: 0.55

  # 言葉との類似度の下限（0より大きく1以下）。既定: 0.65
  # min_similarity: 0.65

  # 発話とみなすマイクの音量（RMS、0より大きく1以下）。小さい声も拾うには下げます。既定: 0.005
  # 下げすぎると雑音もローカルSTTへ送られ、認識の待ちが増えます。
  # energy_threshold: 0.005

  # 呼びかけ後に、呼びかけなしで話せる時間（秒）。最後の発話から数えます。0より大きい値。既定: 300
  # conversation_timeout_seconds: 300

# プラグインの設定。プラグインの名前（internal/plugins/<名前>）ごとに書きます。
# 組み込まれていないプラグインの名前を書くと、起動時にエラーになります。
# シークレットは、ここではなく環境変数で渡します（各プラグインの説明を参照）。
plugins:
  # Claude Code 連携。共有トークンはシークレットなので、環境変数 AGENT_BRIDGE_TOKEN で渡します。
  # URLとトークンの両方があるときだけ有効になります。
  claudecode:
    # 手元のMacで動く agent-bridge（services/agent-bridge）のURL。既定: なし（Claude Code連携は無効）
    # url: "http://100.x.y.z:8787"

  # Google カレンダー。OAuth クライアントの ID とシークレットはシークレットなので、
  # 環境変数 GOOGLE_CLIENT_ID・GOOGLE_CLIENT_SECRET で渡します。両方があるときだけ有効になります。
  googlecalendar:
    # OAuth のコールバックURL。既定: "http://localhost:8081/oauth/google/callback"
    # redirect_url: "http://localhost:8081/oauth/google/callback"

    # OAuth のスコープ。既定: "https://www.googleapis.com/auth/calendar.events"
    # scope: "https://www.googleapis.com/auth/calendar.events"

    # トークンの保存先。既定: memory.store_path と同じディレクトリの "google_oauth_token.json"
    # token_path: "data/google_oauth_token.json"

  # MCP サーバー。登録したサーバーのツールを「<サーバー名>__<ツール名>」として会話から使えます。
  # 設定の変更はサーバーの再起動で反映します。文字列の ${VAR} は環境変数で展開するので、秘密の値は環境変数で渡します。
  mcp:
    # OAuth のコールバックURL。認可サーバーのリダイレクト URI に登録します。
    # 本番では、画面を開いている HTTPS の住所のものを書きます。既定（localhost）は手元で開発するとき用です。
    # 既定: "http://localhost:8081/oauth/mcp/callback"
    # redirect_url: "https://speaker.example.com/oauth/mcp/callback"

    # OAuth のトークンの保存先。既定: memory.store_path と同じディレクトリの "mcp_oauth.json"
    # token_path: "data/mcp_oauth.json"

    # サーバー。キーがサーバー名（英数字・_・-）で、ツール名の接頭辞になります。既定: なし
    # servers:
    #   # OAuth が要るリモートの MCP サーバー（Streamable HTTP）。
    #   # 画面の「設定」から認可すると、再起動しなくてもツールが出ます。
    #   calendar:
    #     url: "https://calendarmcp.googleapis.com/mcp/v1"
    #     # 会話に出すツール（MCP サーバー上の名前）。書かなければ全部出します。
    #     allowed_tools: [list_events, get_event, create_event, update_event]
    #     oauth:
    #       # 動的クライアント登録に対応していないサーバーは、事前に作った OAuth クライアントを書きます。
    #       client_id: "${MCP_CALENDAR_CLIENT_ID}"
    #       client_secret: "${MCP_CALENDAR_CLIENT_SECRET}"
    #       # 要求するスコープ。書かなければサーバーが示すスコープを全部要求します。
    #       scopes: ["https://www.googleapis.com/auth/calendar.events"]
    #
    #   # 固定のトークンをヘッダーで渡すリモートの MCP サーバー。
    #   example:
    #     url: "https://mcp.example.com/mcp"
    #     headers:
    #       Authorization: "Bearer ${EXAMPLE_MCP_TOKEN}"
    #
    #   # stdio のローカル MCP サーバー。コマンドはサーバー（本番は Docker コンテナ）の中で動きます。
    #   local:
    #     command: "/usr/local/bin/some-mcp-server"
    #     args: ["--flag"]
    #     env:
    #       API_KEY: "${SOME_API_KEY}"
    #     # false にすると接続しません。既定: true
    #     enabled: false

  # SwitchBot。トークンとシークレットはシークレットなので、環境変数 SWITCHBOT_TOKEN・SWITCHBOT_SECRET で渡します。
  # 両方があるときだけ有効になります。
  switchbot:
    # 機器名と SwitchBot のデバイスIDの対応。scripts/switchbot_deviceids.rb で一覧を取得できます。既定: なし
    # device_map:
    #   hub2: "XXXXXXXXXXXX"
