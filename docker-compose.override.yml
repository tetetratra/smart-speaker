services:
  server:
    build:
      target: dev
    volumes:
      - .:/app
    command: ["go", "run", "./cmd/smart-speaker"]
  web:
    image: node:20-bookworm
    working_dir: /app
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    command: ["sh", "-c", "npm install && npm run dev -- --host --config web/vite.config.ts"]
    ports:
      - "5173:5173"

volumes:
  node_modules:
