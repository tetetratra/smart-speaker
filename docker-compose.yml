services:
  server:
    build:
      context: .
      target: runtime
    depends_on:
      - voicevox
      - local-stt
    # コンテナが落ちたら自動で再起動する
    # Dockerデーモン再起動後も自動起動する
    # Ctrl+C や docker stop で手動停止した場合は再起動せずに停止する
    restart: unless-stopped

    ports:
      - "8081:8081"
      - "50000-50100:50000-50100/udp"
    volumes:
      - /var/lib/smart-speaker/data:/app/data
    # シークレット以外の設定値は config.yaml に書く（config.sample.yaml を参照）
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      SWITCHBOT_TOKEN: ${SWITCHBOT_TOKEN:-}
      SWITCHBOT_SECRET: ${SWITCHBOT_SECRET:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      # デプロイスクリプトが本番サーバーのIPを取得して渡す。config.yaml の rtc.ice_advertise_ips より優先する
      RTC_ICE_ADVERTISE_IPS: ${RTC_ICE_ADVERTISE_IPS:-}

  voicevox:
    image: voicevox/voicevox_engine:cpu-0.26.0
    restart: unless-stopped

  local-stt:
    build: ./services/local-stt
    restart: unless-stopped
    environment:
      LOCAL_STT_MODEL: ${LOCAL_STT_MODEL:-small}
      LOCAL_STT_THREADS: ${LOCAL_STT_THREADS:-4}
      LOCAL_STT_VAD_THRESHOLD: ${LOCAL_STT_VAD_THRESHOLD:-0.35}
    volumes:
      - local-stt-model-cache:/models

volumes:
  local-stt-model-cache:
