services:
  server:
    build:
      context: .
      target: runtime
    depends_on:
      - embedding
    # コンテナが落ちたら自動で再起動する
    # Dockerデーモン再起動後も自動起動する
    # Ctrl+C や docker stop で手動停止した場合は再起動せずに停止する
    restart: unless-stopped

    ports:
      - "8081:8081"
      - "50000-50100:50000-50100/udp"
    volumes:
      - /var/lib/smart-speaker/data:/app/data
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY}
      ELEVENLABS_VOICE_ID: ${ELEVENLABS_VOICE_ID}
      ELEVENLABS_MODEL_ID: ${ELEVENLABS_MODEL_ID}
      RTC_ICE_HOST_IPS: ${RTC_ICE_HOST_IPS}
      SWITCHBOT_TOKEN: ${SWITCHBOT_TOKEN}
      SWITCHBOT_SECRET: ${SWITCHBOT_SECRET}
      SWITCHBOT_DEVICE_MAP: ${SWITCHBOT_DEVICE_MAP}
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT}
      GOOGLE_APPLICATION_CREDENTIALS_JSON: ${GOOGLE_APPLICATION_CREDENTIALS_JSON}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_REDIRECT_URL: ${GOOGLE_REDIRECT_URL}
      GOOGLE_OAUTH_SCOPE: ${GOOGLE_OAUTH_SCOPE}

  embedding:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.9
    command: ["--model-id", "intfloat/multilingual-e5-small"]
    restart: unless-stopped
    volumes:
      - embedding-model-cache:/data

volumes:
  embedding-model-cache:
