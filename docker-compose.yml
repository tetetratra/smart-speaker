services:
  server:
    build:
      context: .
      target: runtime
    depends_on:
      - embedding
      - voicevox
      - local-stt
    # コンテナが落ちたら自動で再起動する
    # Dockerデーモン再起動後も自動起動する
    # Ctrl+C や docker stop で手動停止した場合は再起動せずに停止する
    restart: unless-stopped

    ports:
      - "8081:8081"
      - "50000-50100:50000-50100/udp"
    volumes:
      - /var/lib/smart-speaker/data:/app/data
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_RESPONSES_MODEL: ${OPENAI_RESPONSES_MODEL:-}
      OPENAI_REALTIME_MODEL: ${OPENAI_REALTIME_MODEL:-gpt-realtime-2.1}
      OPENAI_REALTIME_VAD: ${OPENAI_REALTIME_VAD:-semantic_vad}
      OPENAI_REALTIME_TRANSCRIPTION_MODEL: ${OPENAI_REALTIME_TRANSCRIPTION_MODEL:-gpt-4o-mini-transcribe}
      OPENAI_MEMORY_MODEL: ${OPENAI_MEMORY_MODEL:-}
      WAKE_MODE_STORE_PATH: ${WAKE_MODE_STORE_PATH:-/app/data/wake-mode.json}
      LOCAL_STT_ENDPOINT: ${LOCAL_STT_ENDPOINT:-http://local-stt:8000/transcribe}
      MEMORY_STORE_PATH: ${MEMORY_STORE_PATH:-/app/data/memories.json}
      MEMORY_EMBEDDING_BASE_URL: ${MEMORY_EMBEDDING_BASE_URL:-http://embedding:80}
      MEMORY_EMBEDDING_MODEL: ${MEMORY_EMBEDDING_MODEL:-intfloat/multilingual-e5-small}
      MEMORY_SIMILARITY_THRESHOLD: ${MEMORY_SIMILARITY_THRESHOLD:-0.95}
      MEMORY_MAX_TAGS: ${MEMORY_MAX_TAGS:-5}
      TTS_PROVIDER: ${TTS_PROVIDER:-voicevox}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY}
      ELEVENLABS_VOICE_ID: ${ELEVENLABS_VOICE_ID}
      ELEVENLABS_MODEL_ID: ${ELEVENLABS_MODEL_ID}
      VOICEVOX_ENDPOINT: ${VOICEVOX_ENDPOINT:-http://voicevox:50021}
      VOICEVOX_SPEAKER_ID: ${VOICEVOX_SPEAKER_ID:-1}
      VOICEVOX_SPEED_SCALE: ${VOICEVOX_SPEED_SCALE:-}
      RTC_ICE_ADVERTISE_IPS: ${RTC_ICE_ADVERTISE_IPS:-}
      SWITCHBOT_TOKEN: ${SWITCHBOT_TOKEN}
      SWITCHBOT_SECRET: ${SWITCHBOT_SECRET}
      SWITCHBOT_DEVICE_MAP: ${SWITCHBOT_DEVICE_MAP}
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT}
      GOOGLE_APPLICATION_CREDENTIALS_JSON: ${GOOGLE_APPLICATION_CREDENTIALS_JSON}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_REDIRECT_URL: ${GOOGLE_REDIRECT_URL}
      GOOGLE_OAUTH_SCOPE: ${GOOGLE_OAUTH_SCOPE}

  embedding:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.9
    platform: ${EMBEDDING_PLATFORM:-linux/amd64}
    command: ["--model-id", "${MEMORY_EMBEDDING_MODEL:-intfloat/multilingual-e5-small}"]
    restart: unless-stopped
    volumes:
      - embedding-model-cache:/data

  voicevox:
    image: voicevox/voicevox_engine:cpu-0.26.0
    restart: unless-stopped

  local-stt:
    build: ./services/local-stt
    restart: unless-stopped
    environment:
      LOCAL_STT_MODEL: ${LOCAL_STT_MODEL:-small}
      LOCAL_STT_THREADS: ${LOCAL_STT_THREADS:-4}
    volumes:
      - local-stt-model-cache:/models

volumes:
  local-stt-model-cache:
  embedding-model-cache:
